name: Build

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang make
      - name: Run host test suites
        run: make test

  ps5-payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image (PS5 Payload SDK v0.43, see Dockerfile)
        run: docker build -t omnipad-build .
      - name: Build payload
        run: docker run --rm -v "$PWD:/work" omnipad-build make ps5
      - name: List output
        run: ls -la dist/
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: OmniPad-PS5-elf
          path: dist/OmniPad-PS5-*-b*.elf
          if-no-files-found: error
